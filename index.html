<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Bài tập Form HTML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .form-card {
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        h2 {
            color: #2c3e50;
            margin-top: 0;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group input[type="date"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .checkbox-group, .radio-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-submit {
            background-color: #3498db;
            color: white;
        }

        .btn-reset {
            background-color: #e74c3c;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- PHẦN 1 -->
    <div class="form-card">
        <h2>Phần 1: Thông Tin Cá Nhân & Sở Thích</h2>
        <form action="#" method="GET">
            <div class="form-group">
                <label for="yourname">Họ và tên:</label>
                <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên..." required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label>Sở thích:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>
                    <label><input type="checkbox" name="hobby" value="music"> Nghe nhạc</label>
                    <label><input type="checkbox" name="hobby" value="sports"> Thể thao</label>
                    <label><input type="checkbox" name="hobby" value="travel"> Du lịch</label>
                </div>
            </div>

            <div class="btn-group">
                <input type="submit" value="Gửi thông tin" class="btn btn-submit">
                <input type="reset" value="Nhập lại" class="btn btn-reset">
            </div>
        </form>
    </div>

    <!-- PHẦN 2 -->
    <div class="form-card">
        <h2>Phần 2: Form Đăng Ký Học Viên</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="fullname">Họ và tên học viên (Full Name):</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nhập tên học viên..." required>
            </div>

            <div class="form-group">
                <label for="dob">Ngày sinh (Date of Birth):</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="form-group">
                <label>Giới tính (Gender):</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male" checked> Nam</label>
                    <label><input type="radio" name="gender" value="female"> Nữ</label>
                    <label><input type="radio" name="gender" value="other"> Khác</label>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại (Phone Number):</label>
                <input type="tel" id="phone" name="phone" placeholder="0901234567" required>
            </div>

            <div class="form-group">
                <label for="student_email">Email liên hệ (Email Address):</label>
                <input type="email" id="student_email" name="student_email" placeholder="hocvien@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="course">Khóa học đăng ký (Select Course):</label>
                <select id="course" name="course_id">
                    <option value="">-- Chọn khóa học --</option>
                    <option value="web">Lập trình Web Cơ bản (HTML/CSS/JS)</option>
                    <option value="python">Lập trình Python</option>
                    <option value="design">Thiết kế Đồ họa (UI/UX)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Ghi chú thêm (Notes):</label>
                <textarea id="notes" name="notes" rows="3" placeholder="Yêu cầu hoặc ghi chú thêm..."></textarea>
            </div>

            <div class="btn-group">
                <input type="submit" value="Đăng ký học" class="btn btn-submit">
                <input type="reset" value="Nhập lại" class="btn btn-reset">
            </div>
        </form>
    </div>

</div>

</body>
</html>
